services:
  postgres:
    image: postgres:16
    container_name: interactmd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: interactmd
      POSTGRES_USER: interactmd
      POSTGRES_PASSWORD: interactmd
    ports:
      - "5432:5432"
    volumes:
      - interactmd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interactmd -d interactmd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  interactmd_postgres_data:
    driver: local
